name: Windows GUI installer
on: [push, pull_request]
jobs:
  build-test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test installer
        shell: powershell
        run: |
          try {
            & ./installer/build.ps1 *> "$env:RUNNER_TEMP\installer-build.log"
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          } catch {
            Get-Content "$env:RUNNER_TEMP\installer-build.log" | ForEach-Object { Write-Host "::error::$($_)" }
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }
      - name: Test live download to temporary folder
        if: github.event_name == 'push'
        shell: powershell
        run: |
          ./installer-output/InstallerTests.exe --live-test
          if ($LASTEXITCODE -ne 0) { throw 'Live preview download test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: HyperRealism128-Windows-GUI-installer
          path: |
            installer-output/HyperRealism128-Installer.exe
            installer-output/layout-smoke.png
          if-no-files-found: error
          retention-days: 30
      - name: Store rendered UI preview in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/4c25d324-hyperrealismbyarena'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=docs/installer-ui-preview.png
          content=$(base64 -w 0 installer-output/layout-smoke.png)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="chore: update installer UI preview [skip ci]" -f branch="${GITHUB_REF_NAME}" -f content="${content}")
          if [ -n "$sha" ]; then args+=(-f sha="${sha}"); fi
          gh api "${args[@]}"
  publish-installer-16:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/4c25d324-hyperrealismbyarena' && startsWith(github.event.head_commit.message, 'Publish installer 16')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HyperRealism128-Windows-GUI-installer
          path: installer-assets
      - name: Checksum and publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installer-assets
          sha256sum HyperRealism128-Installer.exe > HyperRealism128-Installer.exe.sha256
          sha256sum -c HyperRealism128-Installer.exe.sha256
          gh release create v0.1.0-installer.16 HyperRealism128-Installer.exe HyperRealism128-Installer.exe.sha256 layout-smoke.png --target "$GITHUB_SHA" --title 'HyperRealism 512×512 — Windows installer 16' --notes-file ../.github/installer-release-notes.md --prerelease
      - name: Attach current installer to all published preview releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and (.tag_name | startswith("v0.1.0-preview."))) | .tag_name'); do
            gh release upload "$tag" installer-assets/HyperRealism128-Installer.exe installer-assets/HyperRealism128-Installer.exe.sha256 --clobber
          done
