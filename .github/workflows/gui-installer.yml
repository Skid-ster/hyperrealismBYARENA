name: Windows GUI installer
on: [push, pull_request]
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test installer
        shell: powershell
        run: |
          try {
            & ./installer/build.ps1 *> "$env:RUNNER_TEMP\installer-build.log"
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          } catch {
            Get-Content "$env:RUNNER_TEMP\installer-build.log" | ForEach-Object { Write-Host "::error::$($_)" }
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }
      - name: Capture sidebar for review
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Review launcher sidebar')
        shell: powershell
        run: |
          $image = Join-Path $env:RUNNER_TEMP 'layout.png'
          $p = Start-Process -FilePath ./installer-output/HyperRealism128-Installer.exe -ArgumentList @('--capture-ui', "`"$image`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Unable to capture GUI' }
          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::FromFile($image)
          $crop = $bitmap.Clone([System.Drawing.Rectangle]::new($bitmap.Width - 133, 69, 125, 330), $bitmap.PixelFormat)
          $cropped = Join-Path $env:RUNNER_TEMP 'sidebar.png'
          $crop.Save($cropped, [System.Drawing.Imaging.ImageFormat]::Png)
          $crop.Dispose(); $bitmap.Dispose()
          $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes($cropped))
          $size = 4000
          for ($i = 0; $i -lt $data.Length; $i += $size) {
            $n = [Math]::Min($size, $data.Length - $i)
            Write-Host ("::notice title=SIDEBAR-{0:D3}::{1}" -f ($i / $size), $data.Substring($i, $n))
          }
      - name: Test live download to temporary folder
        if: github.event_name == 'push'
        shell: powershell
        run: |
          ./installer-output/InstallerTests.exe --live-test
          if ($LASTEXITCODE -ne 0) { throw 'Live preview download test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: HyperRealism128-Windows-GUI-installer
          path: installer-output/HyperRealism128-Installer.exe
          if-no-files-found: error
          retention-days: 30
  publish-installer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/e000bf82-hyperrealismbyarena' && startsWith(github.event.head_commit.message, 'Publish GUI installer 8')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HyperRealism128-Windows-GUI-installer
          path: installer-assets
      - name: Checksum and publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installer-assets
          sha256sum HyperRealism128-Installer.exe > HyperRealism128-Installer.exe.sha256
          sha256sum -c HyperRealism128-Installer.exe.sha256
          gh release create v0.1.0-installer.8 HyperRealism128-Installer.exe HyperRealism128-Installer.exe.sha256 --target "$GITHUB_SHA" --title 'HyperRealism128 — Windows GUI installer 8' --notes-file ../.github/installer-release-notes.md --prerelease
      - name: Attach installer to existing preview releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v0.1.0-preview.1 v0.1.0-preview.2 v0.1.0-preview.3 v0.1.0-preview.4 v0.1.0-preview.5; do
            gh release upload "$tag" installer-assets/HyperRealism128-Installer.exe installer-assets/HyperRealism128-Installer.exe.sha256 --clobber
          done
