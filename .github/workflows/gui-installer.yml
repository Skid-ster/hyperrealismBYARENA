name: Windows GUI installer
on: [push, pull_request]
jobs:
  build-test:
    permissions:
      contents: read
      issues: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test installer
        shell: powershell
        run: |
          try {
            & ./installer/build.ps1 *> "$env:RUNNER_TEMP\installer-build.log"
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          } catch {
            Get-Content "$env:RUNNER_TEMP\installer-build.log" | ForEach-Object { Write-Output "::error::$($_)" }
            Write-Output "::error::$($_.Exception.Message)"
            "## Installer build diagnostics`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content "$env:RUNNER_TEMP\installer-build.log" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
      - name: Share installer build diagnostics for this run
        if: failure() && github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP 'installer-build.log'
          $details = if (Test-Path -LiteralPath $logPath) { Get-Content -LiteralPath $logPath -Raw } else { 'Build log was not produced.' }
          if ($details.Length -gt 45000) { $details = $details.Substring($details.Length - 45000) }
          $body = "Temporary Windows installer build diagnostics for run $env:GITHUB_RUN_ID. Remove after inspection.`r`n````text`r`n$details`r`n````"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/3/comments"
          $comment = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body (@{ body = $body } | ConvertTo-Json -Depth 4)
          Write-Output "Posted temporary installer diagnostic comment $($comment.id)."
      - name: Test live download to temporary folder
        if: github.event_name == 'push'
        shell: powershell
        run: |
          ./installer-output/InstallerTests.exe --live-test
          if ($LASTEXITCODE -ne 0) { throw 'Live preview download test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: HyperRealism128-Windows-GUI-installer
          path: installer-output/HyperRealism128-Installer.exe
          if-no-files-found: error
          retention-days: 30
  publish-installer-12:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/65b59fff-hyperrealismbyarena' && startsWith(github.event.head_commit.message, 'Publish installer 12')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HyperRealism128-Windows-GUI-installer
          path: installer-assets
      - name: Checksum and publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installer-assets
          sha256sum HyperRealism128-Installer.exe > HyperRealism128-Installer.exe.sha256
          sha256sum -c HyperRealism128-Installer.exe.sha256
          gh release create v0.1.0-installer.12 HyperRealism128-Installer.exe HyperRealism128-Installer.exe.sha256 --target "$GITHUB_SHA" --title 'HyperRealism 512×512 — Windows installer 12' --notes-file ../.github/installer-release-notes.md --prerelease
      - name: Attach current installer to all published preview releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and (.tag_name | startswith("v0.1.0-preview."))) | .tag_name'); do
            gh release upload "$tag" installer-assets/HyperRealism128-Installer.exe installer-assets/HyperRealism128-Installer.exe.sha256 --clobber
          done
