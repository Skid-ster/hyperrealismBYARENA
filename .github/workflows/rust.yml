name: Rust tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo run --locked --release -- --input test_assets --output test_output --cpu-only
      - run: cargo run --locked --release -- --input work --output pilot_output --cpu-only --threads 2
      - name: Test preview installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install-preview.tests.ps1
      - name: Upload experimental pack
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: HyperRealism128-MC26.3-experimental
          path: |
            pilot_output/dist/HyperRealism128-v1.0-MC26.3.zip
            pilot_output/build_report.json
            pilot_output/contact_sheet.png
          if-no-files-found: error
          retention-days: 30

  publish-preview-2:
    # This one-time, explicitly requested prerelease only runs for this commit
    # message on the session branch, after both Windows and Linux tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/e000bf82-hyperrealismbyarena' && startsWith(github.event.head_commit.message, 'Publish experimental preview 2')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked --release -- --input work --output release_build --cpu-only --threads 2
      - name: Prepare and check release assets
        run: |
          mkdir release_assets
          cp release_build/dist/HyperRealism128-v1.0-MC26.3.zip release_assets/HyperRealism128-MC26.3-EXPERIMENTAL.zip
          cp release_build/build_report.json release_assets/build_report.json
          cp scripts/Install-HyperRealismPreview.ps1 release_assets/Install-HyperRealismPreview.ps1
          cd release_assets
          sha256sum HyperRealism128-MC26.3-EXPERIMENTAL.zip > HyperRealism128-MC26.3-EXPERIMENTAL.zip.sha256
          sha256sum -c HyperRealism128-MC26.3-EXPERIMENTAL.zip.sha256
          python -c "import zipfile; z=zipfile.ZipFile('HyperRealism128-MC26.3-EXPERIMENTAL.zip'); assert z.testzip() is None; assert len([n for n in z.namelist() if n.endswith('.png')]) == 309; assert 'MATERIAL_CREDITS.txt' in z.namelist(); assert 'pack.mcmeta' in z.namelist()"
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-preview.2 release_assets/HyperRealism128-MC26.3-EXPERIMENTAL.zip release_assets/HyperRealism128-MC26.3-EXPERIMENTAL.zip.sha256 release_assets/Install-HyperRealismPreview.ps1 release_assets/build_report.json --target "$GITHUB_SHA" --title 'HyperRealism128 — experimental 26.3 preview 2' --notes-file .github/preview-release-notes.md --prerelease
