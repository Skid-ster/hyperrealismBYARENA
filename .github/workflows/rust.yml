name: Rust tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo run --locked --release -- --input test_assets --output test_output --cpu-only
      - run: cargo run --locked --release -- --input work --output pilot_output --cpu-only --threads 2
